apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    compileSdk = 34
    defaultConfig {
        applicationId 'com.obddroid'
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 20616
        versionName 'OBDroid'

        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"

        // AutoCheck API – override in local.properties (gitignored)
        buildConfigField "String", "AUTOCHECK_API_BASE_URL", "\"${project.findProperty('AUTOCHECK_API_BASE_URL') ?: ''}\""
        buildConfigField "String", "AUTOCHECK_API_KEY", "\"${project.findProperty('AUTOCHECK_API_KEY') ?: ''}\""

        lintOptions {
            // Override lint error on targetSdkVersion
            abortOnError = false
        }

        compileOptions {
            sourceCompatibility JavaVersion.VERSION_17
            targetCompatibility JavaVersion.VERSION_17
        }

        kotlinOptions {
            jvmTarget = "17"
        }

        gradle.projectsEvaluated {
            tasks.withType(JavaCompile).configureEach {
                options.compilerArgs << "-Xlint:deprecation" << "-Xlint:unchecked"
            }
        }
    }

    sourceSets {
        main {
            java.srcDirs = ['src/java']
            resources.srcDirs = ['src/resources']
            manifest.srcFile 'src/AndroidManifest.xml'
        }
    }

    applicationVariants.configureEach { variant ->
        variant.resValue "string", "app_version", variant.versionName
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/io.netty.versions.properties']
        }
    }

    productFlavors {
    }
    lint {
        abortOnError = false
    }
    testOptions {
        // android.util.Log etc. return defaults in JVM unit tests instead of throwing
        unitTests.returnDefaultValues = true
    }
    namespace = 'com.obddroid'
}

dependencies {
    implementation 'com.fazecast:jSerialComm:2.10.4'
    implementation 'com.github.mik3y:usb-serial-for-android:3.9.0'
    implementation 'com.github.anastr:speedviewlib:1.6.1'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'  // Modern charting library
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.hivemq:hivemq-mqtt-client:1.3.0'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'  // Fluid responsive card layout
    implementation 'androidx.car.app:app:1.4.0'  // Android Auto car screens

    testImplementation 'junit:junit:4.13.2'

    // Gson for JSON serialization (used by AutoCheck and other features)
    implementation 'com.google.code.gson:gson:2.10.1'

    // Automotive Logo Library
    implementation project(':automotive-logo-library-android')

    // DTC Database - Comprehensive diagnostic trouble code database
    implementation project(':dtc-database-android')

    // NHTSA Recall Lookup - Vehicle recall campaign data
    implementation project(':nhtsa-recall-lookup')

    // CoPilot AI Assistant UI
    implementation 'com.airbnb.android:lottie:6.2.0'  // Animated avatars
    implementation ('io.noties.markwon:core:4.6.2') {  // Markdown rendering in chat
        exclude group: 'org.jetbrains', module: 'annotations-java5'
    }
    implementation ('io.noties.markwon:syntax-highlight:4.6.2') {  // Code blocks
        exclude group: 'org.jetbrains', module: 'annotations-java5'
    }
    implementation 'com.google.android.material:material:1.11.0'  // Material chips, animations
}
